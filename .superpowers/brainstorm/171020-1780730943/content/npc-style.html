<h2>NPC 视觉风格</h2>
<p class="subtitle">下面是四个 NPC 形象方向在 12×12 岛屿网格上的效果预览。每个 NPC 有朝下/朝上/朝左/朝右四方向行走动画。</p>

<div class="cards">
  <div class="card" data-choice="wizard" onclick="toggleSelect(this)">

    <div class="card-body">
      <h3>A. 法师/导师</h3>

  </div>

    <div class="card-body">

      <p>圆头 + 布衣，亲和力强。适合各类日常任务发放角色。</p>
    </div>
  </div>
</div>

      ctx.fillRect(b.x*CELL+2, b.y*CELL+2, CELL-4, CELL-4);

    for (let py=0; py<NPC_W; py++) {
      for (let px=0; px<NPC_W; px++) {
        const c = pixels[py]?.[px];
        if (!c) continue;
        ctx.fillStyle = c===1 ? color : (c===2 ? accent : c);
        ctx.fillRect(ox+px, oy+py, 1, 1);
      }
    }
  }

    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
